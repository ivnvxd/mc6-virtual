name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Build the universal app
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          VERSION="${GITHUB_REF_NAME#v}" scripts/make-app.sh --arch arm64 --arch x86_64
      - name: Zip
        run: |
          zip="MC6-Virtual-$VERSION.zip"
          ditto -c -k --keepParent "dist/MC6 Virtual.app" "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "MC6 Virtual $VERSION" --generate-notes
      # Runs only when the TAP_TOKEN secret exists: a token that can push to ivnvxd/homebrew-tap.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/ivnvxd/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" packaging/mc6-virtual.rb > tap/Casks/mc6-virtual.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mc6-virtual.rb
          git commit -m "mc6-virtual $VERSION"
          git push
